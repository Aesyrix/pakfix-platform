; PakFix PHP settings.
memory_limit = 512M

; Large enough for the photo and short-video uploads the assistant accepts.
upload_max_filesize = 64M
post_max_size = 72M
max_file_uploads = 10

; AI provider calls can be slow; the request must outlive them.
max_execution_time = 120
max_input_time = 120

date.timezone = Asia/Karachi

; Never print a stack trace to a response body in a container.
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
