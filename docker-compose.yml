# PakFix — local development stack
#
#   docker compose up -d
#
# Brings up PostgreSQL, Redis, the Laravel API behind Nginx, a queue worker,
# the scheduler, and the Next.js frontend. The API and the frontend mount the
# working tree, so an edit is live without a rebuild.
#
# Production uses the same images with the bind mounts removed; see
# docs/deployment.md.

name: pakfix

services:
  postgres:
    image: postgres:16-alpine
    container_name: pakfix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pakfix}
      POSTGRES_USER: ${DB_USERNAME:-pakfix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      # Pakistani names and addresses are stored as UTF-8 throughout.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Everything else waits on this, so a cold start cannot race the database.
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-pakfix} -d ${DB_DATABASE:-pakfix}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: pakfix-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: '8.3'
    container_name: pakfix-api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/pakfix.ini:ro
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: pakfix-nginx
    restart: unless-stopped
    ports:
      - '${API_PORT:-8000}:80'
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  # Queues carry the work that must not block a request: e-mail, AI calls,
  # image processing, PDF generation.
  queue:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: '8.3'
    container_name: pakfix-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --max-time=3600 --sleep=1
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Maintenance reminders, quote expiry and auto-confirmation all hang off this.
  scheduler:
    build:
      context: ./docker/php
      args:
        PHP_VERSION: '8.3'
    container_name: pakfix-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:22-alpine
    container_name: pakfix-web
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - '${WEB_PORT:-3000}:3000'
    volumes:
      - ./frontend:/app
      # Keeps the container's node_modules off the host, where the platform
      # and architecture may not match.
      - web-node-modules:/app/node_modules
    environment:
      # Server components run inside the network and talk to nginx directly;
      # the browser reaches the API on the published port.
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:${WEB_PORT:-3000}
      WATCHPACK_POLLING: 'true'
    depends_on:
      - nginx

volumes:
  postgres-data:
  redis-data:
  web-node-modules:
